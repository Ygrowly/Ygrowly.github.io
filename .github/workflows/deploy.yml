name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          # Disable the Astro content cache on CI. The action's restore-keys
          # fallback (astro-cache-<os>-) reuses node_modules/.astro from prior
          # runs, and Astro's glob loader keeps stale content-store entries for
          # deleted posts, which breaks the build after removing articles.
          cache: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5